name: Tests

# Pull requests get a fast smoke gate: the offline self-checks plus the few tests that
# prove the critical paths still work. The full regression runs after a merge to main,
# on weekday mornings and on demand, with the API and UI suites as separate parallel jobs.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1-5"   # weekday mornings, also catches changes on the demo sites
  workflow_dispatch:
    inputs:
      env:
        description: "Environment file to use (src/test/resources/environments)"
        default: demo
      browser:
        description: "Browser for the UI tests"
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ENV: ${{ inputs.env || 'demo' }}
  BROWSER: ${{ inputs.browser || 'chromium' }}
  # Empty unless the repository has these secrets; the demo environment then uses its own public login.
  ORANGEHRM_USERNAME: ${{ secrets.ORANGEHRM_USERNAME }}
  ORANGEHRM_PASSWORD: ${{ secrets.ORANGEHRM_PASSWORD }}

jobs:
  smoke-gate:
    name: Smoke gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install the browser and its system libraries
        run: >
          mvn -B -q test-compile exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps ${BROWSER}"

      - name: Run self-checks and smoke tests (API and UI)
        run: mvn -B test -Dgroups="unit | smoke"

      - name: Build HTML report
        if: always()
        run: |
          mvn -B -q allure:report
          # The report generator adds a Google Analytics tag; take it out before publishing
          perl -0pi -e 's#\s*<script async src="https://www\.googletagmanager\.com.*?</script>\s*<script>.*?</script>##s' target/allure-report/index.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            target/allure-report/index.html
            target/surefire-reports/
            target/accessibility/

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-traces
          path: target/traces/
          if-no-files-found: ignore

  api-regression:
    name: API regression
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run API regression and self-checks
        run: mvn -B test -Dgroups="unit | (api & regression)"

      - name: Build HTML report
        if: always()
        run: |
          mvn -B -q allure:report
          # The report generator adds a Google Analytics tag; take it out before publishing
          perl -0pi -e 's#\s*<script async src="https://www\.googletagmanager\.com.*?</script>\s*<script>.*?</script>##s' target/allure-report/index.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-regression-report
          path: |
            target/allure-report/index.html
            target/surefire-reports/
            target/accessibility/

  ui-regression:
    name: UI regression (${{ inputs.browser || 'chromium' }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install the browser and its system libraries
        run: >
          mvn -B -q test-compile exec:java
          -Dexec.mainClass=com.microsoft.playwright.CLI
          -Dexec.classpathScope=test
          -Dexec.args="install --with-deps ${BROWSER}"

      - name: Run UI regression
        run: mvn -B test -Dgroups="ui & regression"

      - name: Build HTML report
        if: always()
        run: |
          mvn -B -q allure:report
          # The report generator adds a Google Analytics tag; take it out before publishing
          perl -0pi -e 's#\s*<script async src="https://www\.googletagmanager\.com.*?</script>\s*<script>.*?</script>##s' target/allure-report/index.html

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-report
          path: |
            target/allure-report/index.html
            target/surefire-reports/
            target/accessibility/

      - name: Upload Playwright traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-regression-traces
          path: target/traces/
          if-no-files-found: ignore
