# Settings for the public demo sites. This is the default environment.
#
# Any value here can be overridden with a -D property or an environment variable
# (see TestConfig). To add another environment, copy this file to <name>.properties
# and run with -Denv=<name>.

petstore.baseUrl=https://petstore.swagger.io/v2/
orangehrm.baseUrl=https://opensource-demo.orangehrmlive.com

browser=chromium
headless=true

# The OrangeHRM demo login is public: it is printed on the demo's own login page.
# Only the demo environment may keep a login here. For any other environment, leave
# these out and supply ORANGEHRM_USERNAME / ORANGEHRM_PASSWORD from a secret store.
orangehrm.username=Admin
orangehrm.password=admin123
